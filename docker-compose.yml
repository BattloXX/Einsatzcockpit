services:
  app:
    image: ghcr.io/battloxx/einsatzcockpit:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - app_storage:/app/app_storage
    ports:
      - "127.0.0.1:8092:8092"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?in .env setzen}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?in .env setzen}
      MARIADB_USER: ${MARIADB_USER:?in .env setzen}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?in .env setzen}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  app_storage:
  mariadb_data:
  redis_data:

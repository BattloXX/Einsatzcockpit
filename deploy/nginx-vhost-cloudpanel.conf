# CloudPanel-Vhost fuer Einsatzcockpit inkl. MCP-Server (Vorlage).
# Platzhalter {{...}} bleiben fuer CloudPanel erhalten. Anpassen: server_name,
# den alias-Pfad unter /static/ und den App-Port (hier 8093).
#
# In der App-.env muessen gesetzt sein: PUBLIC_BASE_URL=https://<server_name>,
# COOKIE_SECURE=true, TRUST_PROXY_HEADERS=true (TRUSTED_PROXY_IPS=127.0.0.1).

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name test.einsatzcockpit.com;
  {{root}}
  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  {{settings}}
  include /etc/nginx/global_settings;

  index index.html;

  # Statische Dateien direkt ueber nginx (app/static/)
  location ^~ /static/ {
    alias /home/einsatzleiter-test/htdocs/test.einsatzleiter.cloud/app/static/;
    expires max;
    access_log off;
    add_header Access-Control-Allow-Origin "*";
  }

  # WebSocket (Einsatz-Board bleibt stundenlang offen)
  location /ws/ {
    proxy_pass http://127.0.0.1:8093;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # MCP-Endpunkt (Streamable HTTP / SSE): kein Buffering, kein gzip, lange Timeouts.
  # Base64-PDFs: 8 MiB dekodiert = ca. 10,7 MB Request, daher 16m.
  location = /mcp {
    auth_basic off;
    proxy_pass http://127.0.0.1:8093;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_request_buffering off;
    client_max_body_size 16m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
  }

  # MCP-Dokument-Upload (curl vom Rechner des Benutzers, Bearer-Upload-Token): bis 50 MiB,
  # ohne Basic-Auth und ohne Request-Buffering.
  location ^~ /api/mcp/uploads/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8093;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_request_buffering off;
    client_max_body_size 55m;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # OAuth fuer MCP: Discovery und Endpunkte muessen ohne Basic-Auth bei der App ankommen
  # (auch /.well-known/assetlinks.json der Android-App wird von der App ausgeliefert).
  location ^~ /.well-known/ {
    auth_basic off;
    allow all;
    proxy_pass http://127.0.0.1:8093;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(authorize|token|register|revoke)$ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8093;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Alles andere: FastAPI-App
  location / {
    proxy_pass http://127.0.0.1:8093;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_pass_request_headers on;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 900;
    proxy_send_timeout 900;
    proxy_read_timeout 900;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
    # App erlaubt bis 100 MB je PDF (OBJEKT_PDF_MAX_BYTES) und 50 MB je Video
    client_max_body_size 110m;
  }
}

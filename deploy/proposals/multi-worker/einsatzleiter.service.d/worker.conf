# Nur nach Abnahme und expliziter Freigabe installieren. Pfade fuer den Zielhost pruefen.
[Service]
TimeoutStopSec=150
# Die .env kann ECP_GUNICORN_WORKERS=2 setzen. Ohne Eintrag bleibt es bei einem Worker.
Environment=ECP_GUNICORN_WORKERS=1
Environment=LEADER_LOCK_PATH=/home/clp-einsatz/htdocs/einsatzleiter/app_storage/background-leader.lock
ExecStart=
ExecStart=/home/clp-einsatz/htdocs/einsatzleiter/.venv/bin/gunicorn \
    --config /home/clp-einsatz/htdocs/einsatzleiter/deploy/proposals/multi-worker/gunicorn.conf.py \
    app.main:app

name: Release-Version prüfen

"on":
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Version des Tag-Standes prüfen
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'EOF'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          if os.environ["RELEASE_TAG"].removeprefix("v") != version:
              print("::error::Release-Tag und pyproject.toml-Version stimmen nicht überein. "
                    "Releases über release.yml erstellen: Version vor dem Tag setzen.")
              sys.exit(1)
          EOF

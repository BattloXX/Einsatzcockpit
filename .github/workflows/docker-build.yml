name: Docker Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - app/**
      - deploy/docker-entrypoint.sh
      - package.json
      - package-lock.json
      - pyproject.toml
      - tailwind.config.js
      - tailwind.infoscreen.config.js
      - .github/workflows/docker-build.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - app/**
      - deploy/docker-entrypoint.sh
      - package.json
      - package-lock.json
      - pyproject.toml
      - tailwind.config.js
      - tailwind.infoscreen.config.js
      - .github/workflows/docker-build.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (und Push auf main/Tags)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=match,pattern=v(.*),group=1
            type=sha,prefix=sha-,format=short

      - name: Build-Zeitpunkt (UTC)
        id: build_time
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Image bauen (und bei main/Tags pushen)
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build_time.outputs.value }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

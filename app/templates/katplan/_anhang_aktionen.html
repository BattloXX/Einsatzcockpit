<details>
  <summary>Bearbeiten</summary>
  <form method="post" action="/katastrophenplaene/{{ plan.id }}/anhaenge/{{ anhang.uuid }}"
    hx-post="/katastrophenplaene/{{ plan.id }}/anhaenge/{{ anhang.uuid }}" hx-target="#{{ anhang_ziel }}" hx-swap="outerHTML" class="kp-form">
    <input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}">
    <input type="hidden" name="sort" value="{{ anhang.sort }}">
    <label>Beschriftung<input class="form-control" name="beschriftung" maxlength="300" value="{{ anhang.beschriftung or '' }}"></label>
    <label>Urheber<input class="form-control" name="urheber" maxlength="150" value="{{ anhang.urheber or '' }}"></label>
    <label>Aufnahmedatum<input class="form-control" type="date" name="aufnahme_datum" value="{{ anhang.aufnahme_datum or '' }}"></label>
    <label><input type="checkbox" name="vertraulich" value="true" {% if anhang.vertraulich %}checked{% endif %}> Vertraulich</label>
    <button type="submit" class="btn">Speichern</button>
  </form>
</details>
<form method="post" action="/katastrophenplaene/{{ plan.id }}/anhaenge/{{ anhang.uuid }}/loeschen"
  hx-post="/katastrophenplaene/{{ plan.id }}/anhaenge/{{ anhang.uuid }}/loeschen" hx-target="#{{ anhang_ziel }}" hx-swap="outerHTML" hx-confirm="Anhang entfernen?">
  <input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}">
  <button type="submit" class="btn btn--ghost">Entfernen</button>
</form>

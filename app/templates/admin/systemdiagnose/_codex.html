<article class="diag-card" x-data="{copied:false}"><h2>Codex-Auftrag</h2><p>Nur Text; es wird nichts nach GitHub geschrieben.</p><textarea x-ref="auftrag" rows="22" readonly aria-label="Codex-Auftrag">{{ markdown }}</textarea><button type="button" class="btn btn--secondary" @click="navigator.clipboard.writeText($refs.auftrag.value).then(() => copied=true)" x-text="copied ? 'Kopiert' : 'Kopieren'">Kopieren</button></article>

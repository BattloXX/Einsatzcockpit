<article class="sys-card" x-data="{copied:false}">
<header class="sys-card__head"><h2>{{ icon("file-text") }} Codex-Auftrag</h2><button type="button" class="btn btn--secondary" @click="navigator.clipboard.writeText($refs.auftrag.value).then(() => copied=true)" x-text="copied ? 'Kopiert' : 'Kopieren'">Kopieren</button></header>
<p>Nur Text; es wird nichts nach GitHub geschrieben.</p>
<textarea class="form-input sys-mono sys-codex" x-ref="auftrag" rows="22" readonly aria-label="Codex-Auftrag">{{ markdown }}</textarea>
</article>

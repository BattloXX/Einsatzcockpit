<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>QR-Zugang {{ einheit.label }}</title>
  <style>
    @page { size: A4; margin: 1.5cm; }
    body { font-family: Arial, sans-serif; color: #111; margin: 0; }
    .blatt { border: 2px solid #d42225; padding: 1.2cm; text-align: center; }
    h1 { margin: 0; font-size: 24pt; } .lage { margin: .35cm 0 1cm; font-size: 14pt; }
    img { width: 14cm; height: 14cm; max-width: 100%; object-fit: contain; image-rendering: pixelated; }
    .pin { font-size: 20pt; font-weight: bold; margin-top: .5cm; }
    .gueltig { margin-top: .6cm; font-size: 12pt; }
    .toolbar { margin: 1cm; text-align: center; } @media print { .toolbar { display: none; } }
  </style>
</head>
<body onload="setTimeout(function(){ window.print(); }, 350)">
  <div class="toolbar"><button type="button" onclick="window.print()">Drucken</button></div>
  <main class="blatt">
    <h1>QR-Zugang: {{ einheit.label }}</h1>
    <div class="lage">{{ lage.name }}</div>
    <img src="{{ qr_img }}" alt="QR-Code für {{ einheit.label }}">
    {% if pin %}<div class="pin">PIN: {{ pin }}</div>{% endif %}
    <div class="gueltig">Gültig bis {{ zugang.laeuft_ab_at|local_datetime }}</div>
  </main>
</body>
</html>

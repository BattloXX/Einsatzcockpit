<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIN eingeben – {{ lage.name }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/csrf.js" defer></script>
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="/static/img/logo_einsatzcockpit.png" alt="{{ brand }}" class="login-logo__img">
        <p class="login-logo__sub">{{ brand_tagline }}</p>
      </div>
      <p style="text-align:center;color:var(--text-muted);margin-bottom:16px;">{{ lage.name }}</p>
      {% if error == "wrong_pin" %}<p class="alert alert--error">Der PIN ist nicht korrekt.</p>{% endif %}
      <form method="post" action="/lage/{{ lage.id }}/qr-pin" class="login-form">
        <input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}">
        <input type="hidden" name="token" value="{{ token }}">
        {% if open_site %}<input type="hidden" name="open_site" value="{{ open_site }}">{% endif %}
        <div class="form-group">
          <label for="pin">Zugangs-PIN</label>
          <input type="password" id="pin" name="pin" required maxlength="16"
                 inputmode="numeric" autocomplete="one-time-code" class="form-input" autofocus>
        </div>
        <button type="submit" class="btn btn--primary btn--full">Weiter</button>
      </form>
    </div>
  </div>
</body>
</html>

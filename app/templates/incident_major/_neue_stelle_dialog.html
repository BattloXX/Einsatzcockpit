<!-- ── Neue Einsatzstelle Dialog ── -->
<dialog class="modal" id="neuStelleDialog">
  <div class="modal__content" style="min-width:min(480px,95vw);">
    <div class="modal__header">
      <h3 class="modal__title">Einsatzstelle anlegen</h3>
      <button aria-label="Schließen" type="button" data-ec-action="close-dialog" class="modal__close">×</button>
    </div>
    <form hx-post="/lage/{{ lage.id }}/stellen/neu" hx-swap="none" data-no-error-toast
          hx-on::after-request="if(event.detail.successful){ this.closest('dialog').close(); this.reset(); } else { alert('Fehler beim Anlegen: ' + (event.detail.xhr.responseText || 'unbekannter Fehler')); }">
      <input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}">
      <div class="modal__body">
        <div class="form-group">
          <label class="form-label">Bezeichnung <span style="color:var(--red)">*</span></label>
          <input type="text" name="bezeichnung" class="form-input" required maxlength="160"
                 placeholder="z. B. Überschwemmung Hauptstraße" autocomplete="off" autofocus>
        </div>
        <div class="form-row" style="display:flex;gap:8px;">
          <div class="form-group" style="flex:3;">
            <label class="form-label">Straße</label>
            <input type="text" name="strasse" class="form-input" maxlength="120" autocomplete="off">
          </div>
          <div class="form-group" style="flex:1;">
            <label class="form-label">Nr.</label>
            <input type="text" name="hausnr" class="form-input" maxlength="20" autocomplete="off">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Ort</label>
          <input type="text" name="ort" class="form-input" maxlength="120" autocomplete="off">
        </div>
      </div>
      <div class="modal__footer">
        <button type="button" data-ec-action="close-dialog" class="btn btn--ghost">Abbrechen</button>
        <button type="submit" class="btn btn--primary">Anlegen</button>
      </div>
    </form>
  </div>
</dialog>

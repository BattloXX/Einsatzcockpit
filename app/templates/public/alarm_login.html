<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d42225">
  <title>Am Einsatz anmelden – {{ brand }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/csrf.js" defer></script>
  <script src="/static/js/native-ptr.js?v={{ ASSET_VERSION }}"></script>
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="/static/img/logo_einsatzcockpit.png" alt="{{ brand }}" class="login-logo__img">
        <p class="login-logo__sub">{{ brand_tagline }}</p>
      </div>
      <h1 style="text-align:center;font-size:1.1rem;margin-bottom:20px;">Am Einsatz {{ incident.alarm_type_code }} anmelden</h1>
      {% if error %}
      <p role="alert" style="color:#f87171;margin-bottom:12px;">{{ error }}</p>
      {% endif %}
      {% if incident.access_pin_hash %}
      <form method="post" action="/alarm/{{ token }}/anmelden" class="login-form">
        <input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}">
        <div class="form-group">
          <label for="pin">Einsatz-PIN</label>
          <input type="password" id="pin" name="pin" required inputmode="numeric" pattern="[0-9]*"
                 maxlength="16" autocomplete="one-time-code" class="form-input" autofocus>
        </div>
        <div class="form-group">
          <label for="display_name">Dein Name</label>
          <input type="text" id="display_name" name="display_name" required maxlength="120"
                 autocomplete="name" class="form-input" placeholder="z. B. Huber Maria">
        </div>
        <button type="submit" class="btn btn--primary btn--full">Zum Einsatz</button>
      </form>
      <p style="font-size:.85rem;color:var(--text-muted);margin:14px 0;">Der Name wird in allen Einträgen mitgeloggt.</p>
      {% else %}
      <p style="margin-bottom:14px;">Für diesen Einsatz ist kein Gastzugang verfügbar.</p>
      {% endif %}
      <a href="/login?next=/einsatz/{{ incident.id }}" class="btn btn--secondary btn--full">Mit eigenem Konto anmelden</a>
    </div>
  </div>
</body>
</html>

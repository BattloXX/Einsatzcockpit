<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Gruppenkommandanten-Zugang</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-body">
  <main class="login-container"><section class="login-card">
    <h1 style="text-align:center">Gruppenkommandanten-Zugang</h1>
    <p id="status" style="text-align:center">Link wird geprüft …</p>
    <div id="details" hidden><p><strong id="lage"></strong><br><span id="einheit"></span></p>
      <button id="open" class="btn btn--primary btn--full" type="button">Zugang öffnen</button>
      <button id="pinRequest" class="btn btn--secondary btn--full" type="button" hidden>Code per SMS anfordern</button>
      <input id="pin" hidden inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-stelliger Code" class="form-input" style="margin-top:12px">
    </div>
  </section></main>
  <script>
  (() => {
    'use strict';
    const token = location.hash.startsWith('#gkz_') ? location.hash.slice(1) : '';
    history.replaceState(null, '', location.pathname + location.search);
    const status = document.getElementById('status'), details = document.getElementById('details');
    const csrf = () => (document.cookie.split('; ').find(x => x.startsWith('ec_csrf=')) || '').split('=').slice(1).join('=');
    async function post(path, body) { const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()}, body:JSON.stringify(body)}); return r.json(); }
    if (!token) { status.textContent = 'Link unvollständig - bitte neuen Link anfordern'; return; }
    post('/gk/pruefen', {token}).then(data => { if (!data.ok) { status.textContent = data.meldung; return; } document.getElementById('lage').textContent=data.lage; document.getElementById('einheit').textContent=data.einheit; details.hidden=false; status.hidden=true; if(data.pin_noetig) { document.getElementById('pinRequest').hidden=false; document.getElementById('open').textContent='Code bestätigen und Zugang öffnen'; }}).catch(() => status.textContent='Verbindung fehlgeschlagen');
    document.getElementById('pinRequest').onclick = async () => { const d=await post('/gk/pin',{token}); status.hidden=false; status.textContent=d.ok?'Code wurde per SMS angefordert.':' '+(d.meldung||'Anforderung fehlgeschlagen.'); if(d.ok) document.getElementById('pin').hidden=false; };
    document.getElementById('open').onclick = async () => { const d=await post('/gk/einloesen',{token,pin:document.getElementById('pin').value}); if(d.ok) window.location.href=d.redirect; else { status.hidden=false; status.textContent=d.meldung; } };
  })();
  </script>
</body></html>

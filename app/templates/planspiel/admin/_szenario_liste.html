<div class="planspiel-table-wrap">
  <table class="planspiel-table">
    <thead><tr><th>Code</th><th>Titel</th><th>Stichwort</th><th>Kategorie</th><th>Schwierigkeit</th><th>Zufall / Gewicht</th><th>Status</th></tr></thead>
    <tbody>{% for item, version in rows %}{% include "planspiel/admin/_szenario_zeile.html" %}{% else %}<tr><td colspan="7">Keine Szenarien gefunden.</td></tr>{% endfor %}</tbody>
  </table>
</div>
<style>
.planspiel-admin { max-width: 1250px; padding: 1rem; }
.planspiel-admin__head { display: flex; justify-content: space-between; gap: 1rem; align-items: center; }
.planspiel-filter { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
.planspiel-filter .form-input { width: auto; min-width: 130px; }
.planspiel-import { margin: .75rem 0; }
.planspiel-table { width: 100%; border-collapse: collapse; }
.planspiel-table th, .planspiel-table td { padding: .55rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.planspiel-badge { display: inline-block; padding: .15rem .4rem; border-radius: 99px; background: var(--surface-high); font-size: .78rem; margin: .08rem; }
.planspiel-badge--warn { background: #8a4b00; color: white; }
.planspiel-tabs { display: flex; flex-wrap: wrap; gap: .4rem; margin: 1rem 0; }
.planspiel-tab { padding: .45rem .7rem; border: 1px solid var(--border); background: var(--surface-low); color: inherit; }
.planspiel-tab.active { background: var(--red); color: white; }
.planspiel-pane { padding: .6rem 0; }
.planspiel-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
.planspiel-grid label { display: grid; gap: .25rem; }
.planspiel-grid textarea { min-height: 6rem; }
.planspiel-checkboxes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .35rem; }
.planspiel-secret { display: grid; gap: .4rem; border: 2px solid #b91c1c; padding: .7rem; margin-top: .75rem; }
.planspiel-event { border: 1px solid var(--border); padding: .75rem; margin: .75rem 0; }
.planspiel-event__head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.planspiel-hint { color: var(--text-muted); font-size: .85rem; }
.planspiel-actions { margin-top: 1rem; }
@media (max-width: 760px) {
  .planspiel-admin { padding: .75rem; }
  .planspiel-admin__head { align-items: flex-start; flex-direction: column; }
  .planspiel-table-wrap { overflow-x: auto; }
  .planspiel-table { min-width: 760px; }
  .planspiel-grid, .planspiel-checkboxes { grid-template-columns: 1fr; }
}
</style>

{% if codes %}
<p>Vorgeschlagene Stichworte: {% for code, score in codes %}<strong>{{ code }}</strong>{% if not loop.last %}, {% endif %}{% endfor %}</p>
{% endif %}
{% if szenarien %}
<p>Passende Szenarien:</p>
<ul>
  {% for scenario in szenarien %}
  <li><button class="btn btn--secondary btn--sm" type="button" onclick="document.getElementById('szenario-id').value='{{ scenario.id }}'">{{ scenario.code }} auswählen</button></li>
  {% endfor %}
</ul>
{% endif %}

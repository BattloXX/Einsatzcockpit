<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Objektpflege – {{ org_name }}</title>
<script defer src="/static/js/alpine.min.js"></script>
<style>
  /* Eigenstaendiger, token-geschuetzter Gastzugang. Die Gestaltung folgt dem
     Fahrtenbuch, ohne dessen angemeldetes Basislayout nachzuladen. */
  :root { --bg:#0b1326; --surface-low:#101a2f; --surface-mid:#162037; --surface-high:#202b43; --surface-highest:#2a3854; --text:#dae2fd; --text-muted:#9aa7c2; --border:#33425f; --red:#d42225; --red-light:#f15a58; --green:#20b86a; --yellow:#f3b341; --radius-md:.5rem; --radius-lg:.75rem; --shadow-card:0 8px 24px rgba(0,0,0,.2); --gutter:1rem; }
  *, *::before, *::after { box-sizing:border-box; }
  body { min-height:100vh; margin:0; padding-bottom:max(2rem, env(safe-area-inset-bottom)); background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .pflege-page { max-width:720px; margin:0 auto; padding:1.25rem 1rem 6rem; }
  .pflege-header { margin-bottom:1.5rem; }.pflege-header__top { display:flex; align-items:flex-start; gap:1rem; }.pflege-header__brand { display:flex; align-items:center; gap:.875rem; min-width:0; }
  .pflege-header__logo { width:auto; max-width:84px; max-height:52px; object-fit:contain; flex-shrink:0; }
  .pflege-header__eyebrow { overflow:hidden; color:var(--red-light); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.72rem; font-weight:700; letter-spacing:.07em; text-overflow:ellipsis; text-transform:uppercase; white-space:nowrap; }
  .pflege-header__title { margin:2px 0 0; font-size:1.5rem; font-weight:700; line-height:1.2; }.pflege-header__sub { margin:.625rem 0 0; color:var(--text-muted); font-size:.88rem; line-height:1.5; }
  h1 { font-size:1.45rem; line-height:1.22; margin:1.25rem 0 .5rem; } h2 { font-size:1.05rem; line-height:1.3; margin:0; } h3 { font-size:.95rem; margin:0 0 .45rem; } p { line-height:1.5; }
  .card, details { --pflege-accent:var(--red); margin:0 0 var(--gutter); padding:1.1rem 1rem; background:var(--surface-mid); border:1px solid var(--border); border-left:4px solid var(--pflege-accent); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); }
  .card:nth-of-type(3n+1), details:nth-of-type(3n+1) { --pflege-accent:var(--green); } summary { cursor:pointer; font-weight:700; } summary::marker { color:var(--red-light); }
  label { display:block; margin:1rem 0 .35rem; color:var(--text-muted); font-size:.78rem; font-weight:600; }
  input, textarea { width:100%; min-height:46px; padding:.75rem .8rem; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface-low); color:var(--text); font:inherit; }
  input:focus, textarea:focus { border-color:var(--red-light); outline:2px solid rgba(241,90,88,.22); outline-offset:1px; } textarea { min-height:100px; resize:vertical; }
  button, .button { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:.65rem .9rem; border:1px solid var(--red); border-radius:var(--radius-md); background:var(--red); color:#fff; font:inherit; font-weight:700; text-decoration:none; cursor:pointer; }
  button:hover, .button:hover { background:#b81d22; }.secondary { border-color:var(--border); background:var(--surface-high); color:var(--text); }.secondary:hover { background:var(--surface-highest); } button:disabled { opacity:.45; cursor:not-allowed; }
  .muted { color:var(--text-muted); font-size:.88rem; }.pflege-daten { display:grid; grid-template-columns:minmax(105px,.7fr) 2fr; gap:.55rem .8rem; margin:.9rem 0 0; }.pflege-daten dt { color:var(--text-muted); font-size:.88rem; }.pflege-daten dd { margin:0; white-space:pre-wrap; }
  .pflege-gefahr { padding:.75rem 0; border-bottom:1px solid var(--border); }.pflege-gefahr:last-child { border-bottom:0; }.badge { display:inline-block; padding:.2rem .5rem; border:1px solid var(--border); border-radius:999px; color:var(--yellow); font-size:.7rem; font-weight:700; }
  .pflege-hinweis { margin:1rem 0 0; padding:.75rem .85rem; border-left:3px solid var(--yellow); border-radius:0 var(--radius-md) var(--radius-md) 0; background:rgba(243,179,65,.08); color:var(--text); font-size:.84rem; }
  .progress { margin-bottom:var(--gutter); padding:.85rem 1rem; background:var(--surface-low); border:1px solid var(--border); border-radius:var(--radius-lg); }.bottom { margin-top:1.5rem; padding:1rem; background:var(--surface-low); border:1px solid var(--border); border-left:4px solid var(--green); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); }.actions { display:flex; flex-wrap:wrap; gap:.55rem; margin-top:1rem; }
  .upload-progress { height:5px; margin-top:.6rem; overflow:hidden; background:var(--surface-highest); border-radius:999px; }.upload-progress i { display:block; width:0; height:100%; background:var(--green); border-radius:999px; }
  .pflege-section--dokumente { --pflege-accent:var(--red); }.pflege-document { padding:1rem 0; border-bottom:1px solid var(--border); }.pflege-document:first-of-type { padding-top:.35rem; }.pflege-document:last-of-type { border-bottom:0; }.pflege-document__meta { display:flex; gap:.65rem; align-items:flex-start; }.pflege-document__meta strong { display:block; line-height:1.35; }.pflege-document__icon { flex:0 0 auto; margin-top:.1rem; padding:.2rem .35rem; border-radius:.25rem; background:rgba(241,90,88,.18); color:var(--red-light); font-size:.65rem; font-weight:800; letter-spacing:.04em; }.pflege-document__actions { margin:.8rem 0; }.pflege-document__upload { display:flex; gap:.55rem; align-items:stretch; }.file-picker { display:flex; align-items:center; flex:1; min-height:44px; margin:0; padding:.45rem .65rem; border:1px dashed var(--border); border-radius:var(--radius-md); color:var(--text-muted); cursor:pointer; }.file-picker span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.file-picker input { position:absolute; width:1px; min-height:1px; padding:0; opacity:0; pointer-events:none; }.pflege-document__upload button { flex:0 0 auto; }.pflege-document__invalidate { margin-top:.55rem; }.pflege-document__invalidate button { min-height:0; padding:.2rem 0; border:0; background:transparent; color:var(--text-muted); font-size:.8rem; font-weight:600; }.pflege-document__invalidate button:hover { background:transparent; color:var(--red-light); }.pflege-document__new { display:flex; flex-direction:column; gap:.65rem; margin-top:.85rem; padding:1rem; border-radius:var(--radius-md); background:var(--surface-low); }
  @media (min-width:720px) { .pflege-page { padding-top:1.75rem; } }
</style>
</head>
<body>
<main class="pflege-page">
  <header class="pflege-header">
    <div class="pflege-header__top"><div class="pflege-header__brand">
      <img class="pflege-header__logo" src="{% if org and org.logo_path %}{{ org.logo_path }}{% else %}/static/img/logo_einsatzcockpit.png{% endif %}" alt="{{ org_name }}" onerror="this.onerror=null;this.src='/static/img/logo_einsatzcockpit.png'">
      <div style="min-width:0"><div class="pflege-header__eyebrow">{{ org_name }}</div><div class="pflege-header__title">Objektpflege</div></div>
    </div></div>
    <p class="pflege-header__sub">Geschützter Gastzugang zur Prüfung und Aktualisierung Ihrer Einsatzdaten.</p>
  </header>
  {% block content %}{% endblock %}
</main>
</body>
</html>

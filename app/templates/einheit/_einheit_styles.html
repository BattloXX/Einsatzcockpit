<style>
/* GSL-Einheitenmodus: Ergänzungen zum Fahrtenbuch-Layout (_fab_styles.html). */
[x-cloak]{display:none !important;}

.einheit-meta{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:flex-end;font-size:.82rem;color:var(--text-muted);}
.einheit-online{color:#35b56a;font-weight:700;}
.einheit-offline{color:#f59e0b;font-weight:700;}
.einheit-sub{font-size:.85rem;color:var(--text-muted);}

.einheit-umschalter{display:flex;gap:.25rem;margin-top:.75rem;flex-wrap:wrap;}
.einheit-umschalter a{padding:.55rem .9rem;min-height:44px;display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;color:var(--text);font-weight:600;}
.einheit-umschalter a.is-active{background:var(--red);border-color:var(--red);color:#fff;}

/* Chips: Priorität, Status, NEU, Outbox */
.einheit-chip{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;padding:.25rem .6rem;font-size:.75rem;font-weight:700;background:var(--surface);text-transform:none;}
.einheit-chip--button{min-height:40px;cursor:pointer;}
.einheit-chip--warn{border-color:#f59e0b;color:#fbbf24;}
.einheit-chip--red{border-color:#d83030;color:#ff8b8b;}
.einheit-chip--orange{border-color:#f59e0b;color:#fbbf24;}
.einheit-chip--yellow{border-color:#d6b000;color:#f5df61;}
.einheit-chip--muted{color:var(--text-muted);}
.einheit-chip--status{border-color:var(--outline);}
.einheit-chip--neu{background:#f59e0b;border-color:#f59e0b;color:#111;}

/* Karten: Akzentfarbe je Priorität (SITE_PRIORITY_COLOR) */
.einheit-card{cursor:pointer;}
.einheit-card--aktuell{box-shadow:0 0 0 2px var(--red-light), var(--shadow-card);}
.einheit-card--kompakt{padding:.8rem .9rem;}
.einheit-card--neu{box-shadow:0 0 0 2px #f59e0b, var(--shadow-card);}
.einheit-card__kopf{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start;}
.einheit-card__fuss{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.6rem;}
.einheit-prio--sofort{--fab-accent:#d83030;}
.einheit-prio--dringend{--fab-accent:#f59e0b;}
.einheit-prio--normal{--fab-accent:#d6b000;}
.einheit-prio--aufschiebbar,.einheit-prio--keine{--fab-accent:var(--outline);}

.einheit-address{font-size:1.1rem;font-weight:700;margin:.35rem 0;}
.einheit-auftrag{background:var(--surface);border-left:3px solid var(--red-light);padding:.6rem .75rem;margin:.6rem 0;font-weight:600;white-space:pre-wrap;}
.einheit-zeile{display:flex;justify-content:space-between;gap:.75rem;padding:.35rem 0;border-bottom:1px solid var(--border);}
.einheit-zeile:last-child{border-bottom:0;}
.einheit-objekt{display:flex;flex-direction:column;align-items:flex-start;width:100%;margin-top:.35rem;}
.einheit-einsatzkarte{margin:.85rem 0;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface);}
.einheit-einsatzkarte__kopf{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.6rem .75rem;font-size:.9rem;}
.einheit-einsatzkarte__kopf a{color:#93c5fd;font-size:.82rem;text-decoration:none;white-space:nowrap;}
.einheit-einsatzkarte__karte{height:220px;z-index:0;}
.einheit-uebersichtskarte{margin-top:1rem;}
.einheit-kartenaktionen{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem;}
.einheit-kartenaktionen .btn{min-height:44px;}
.einheit-karte{min-height:420px;width:100%;border:1px solid var(--border);
  border-radius:var(--radius-md);overflow:hidden;z-index:0;}
.einheit-kartenmarker span{display:block;min-width:32px;padding:7px;border-radius:999px;
  text-align:center;background:#fff;color:#172033;border:2px solid #475569;font-weight:700;
  box-shadow:0 1px 4px #0006;}
.einheit-kartenmarker--naechster span{background:#b71921;color:#fff;border-color:#fff;white-space:nowrap;}
.einheit-kartenmarker--in_arbeit span{background:#f59e0b;color:#111827;white-space:nowrap;}
.einheit-kartenmarker--erkundung span{border-style:dashed;}

.einheit-liste summary{cursor:pointer;padding:.6rem 0;font-weight:700;}
.einheit-liste__eintrag{display:flex;justify-content:space-between;width:100%;min-height:48px;padding:.5rem .25rem;border-bottom:1px solid var(--border);text-align:left;color:var(--text);}
.einheit-gruppe{margin:.75rem 0;}
.einheit-gruppe h3{margin:.25rem 0 .4rem;font-size:.9rem;color:var(--text-muted);}
.einheit-zwischenaktionen{display:flex;gap:.4rem;flex-wrap:wrap;}
.einheit-zwischenaktionen .btn{min-height:40px;}
.einheit-warning--alarm{background:rgba(216,48,48,.17);border-color:#d83030;color:#ffb4b4;}
.einheit-tabbar{display:none;}

/* Aktionen: große Touch-Flächen */
.einheit-aktionen{display:flex;flex-direction:column;gap:.6rem;}
.einheit-action{min-height:56px;width:100%;}
.einheit-action--gefahr{border-color:#d83030;color:#ff8b8b;}
.einheit-actions-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
.einheit-actions-row .btn{min-height:52px;}
.einheit-status-aktuell{display:flex;flex-direction:column;gap:.15rem;padding:.6rem .75rem;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);}
.einheit-status-pending{color:#f59e0b;font-weight:700;font-size:.85rem;}

.einheit-warning{display:flex;justify-content:space-between;align-items:center;gap:.75rem;background:rgba(245,158,11,.12);border:1px solid #f59e0b;padding:.6rem .75rem;border-radius:var(--radius-sm);margin:.6rem 0;}

.einheit-warning--stack{flex-direction:column;align-items:stretch;}
.einheit-warning--stack input{width:100%;min-height:44px;font-size:16px;}
.einheit-warning--stack .btn{width:100%;}

.einheit-simulation{background:#a84f00;color:#fff;padding:.75rem 1rem;border-radius:var(--radius-md);margin-bottom:1rem;}
.einheit-simulation__ende{color:#fff;text-decoration:underline;font-weight:700;}

.einheit-log{padding:.45rem 0;border-bottom:1px solid var(--border);}
.einheit-log--own{border-left:3px solid var(--red-light);padding-left:.6rem;}
.einheit-log__text{white-space:pre-wrap;}
.einheit-thumbs{display:flex;gap:.5rem;flex-wrap:wrap;}
.einheit-thumbs img{width:96px;height:72px;object-fit:cover;border-radius:var(--radius-sm);}
.einheit-material{padding:.65rem 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:.4rem;}
.einheit-material:last-child{border-bottom:0;}
.einheit-material__kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;}
.einheit-material__zurueck,.einheit-material__hinzufuegen{min-height:44px;align-self:flex-start;}
.einheit-material-position{display:grid;grid-template-columns:minmax(0,1fr) 5.5rem auto;gap:.5rem;align-items:center;}
.einheit-material-position .form-control{min-height:44px;}
.einheit-material-position .btn{min-height:44px;}
.einheit-checkbox{display:flex;align-items:center;gap:.5rem;min-height:44px;}
.einheit-checkbox input{width:20px;height:20px;}

.einheit-flyout-body{padding:1rem;overflow:auto;display:flex;flex-direction:column;gap:.75rem;}
.einheit-formular{display:flex;flex-direction:column;gap:.75rem;}
.einheit-ressource-zeile{padding:.65rem 0;border-bottom:1px solid var(--border);}
.einheit-textarea{min-height:200px;font-size:1.05rem;}

@media (max-width:760px){
  .fab-page{padding:1rem .75rem calc(5.5rem + env(safe-area-inset-bottom));}
  .einheit-meta{justify-content:flex-start;}
  .fab-header__top{flex-direction:column;gap:.75rem;}
  .fab-header__brand{width:100%;align-items:flex-start;}
  .fab-header__brand > div{min-width:0;}
  .fab-header__eyebrow{white-space:normal;overflow-wrap:anywhere;}
  .fab-header__title,.fab-card__title{overflow-wrap:anywhere;}
  .fab-card__head{align-items:flex-start;margin-bottom:.75rem;}
  .fab-card__head .einheit-chip{margin-left:auto;flex-shrink:0;}
  .einheit-umschalter{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
  .einheit-umschalter a{justify-content:center;padding:.55rem .45rem;text-align:center;}
  .einheit-actions-row{grid-template-columns:1fr;}
  .einheit-tabbar{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:6px max(.5rem, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(.5rem, env(safe-area-inset-left));background:var(--surface);border-top:1px solid var(--border);}
  .einheit-tabbar button{min-height:48px;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--text);font:inherit;font-weight:700;}
  .einheit-tabbar button[aria-selected="true"]{background:var(--red);color:#fff;}
  .einheit-auftraege{padding-bottom:1rem;}
  .einheit-material-position{grid-template-columns:1fr 5.5rem;}
  .einheit-material-position .btn{grid-column:1 / -1;}
  /* Die gesamte Aktionsleiste darf Einsatzdaten und Karte nicht überdecken. */
  .fab-actions{position:static;background:none;padding:0;margin:.75rem 0 0;}
  .einheit-einsatzkarte__karte{height:190px;}
  .einheit-karte{min-height:320px;}
  .einheit-zeile{align-items:flex-start;}
  .einheit-zeile > :last-child{flex-shrink:0;}
  .person-flyout-backdrop{align-items:flex-end;}
  .person-flyout{width:100%;max-height:88vh;border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
}

@media (min-width:1024px), (min-width:900px) and (orientation:landscape){
  .einheit-bereiche{display:grid;grid-template-columns:minmax(0,1fr) minmax(22rem,.8fr);gap:1rem;}
  .einheit-bereiche .fab-grid__main,.einheit-bereiche .fab-grid__side{display:contents;}
  .einheit-bereiche .einheit-bereich:first-child{grid-column:1 / -1;}
  .einheit-uebersichtskarte{grid-column:1;}
  .einheit-auftraege{grid-column:2;grid-row:2;}
}
</style>

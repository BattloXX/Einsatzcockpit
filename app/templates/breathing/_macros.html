{% macro kontrolle_picker(troop, stufe, label) %}
<div class="press-picker-wrap" x-data="{open:false}" @click.outside="open = false">
  <button type="button" class="btn btn--ghost btn--sm" @click="open = !open">{{ label }}</button>
  <div x-show="open" x-cloak class="press-picker-popup">
    <div class="press-picker-header">Niedrigster Druck des Trupps</div>
    <form hx-post="/einsatz/{{ incident.id }}/atemschutz/{{ troop.id }}/kontrolle" hx-swap="none"
          @htmx:after-request="if ($event.detail.successful) { open = false; } else { ECPBreathingNet.formFailed($event); }"
          @breathing-queued="open = false;">
      <input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}">
      <input type="hidden" name="stufe" value="{{ stufe }}">
      <input type="hidden" name="art" value="funk">
      <div class="press-grid">
        {% for val in range(300, 0, -10) %}
        <button type="submit" name="pressure_bar" value="{{ val }}" class="press-btn">{{ val }}</button>
        {% endfor %}
      </div>
    </form>
  </div>
</div>
{% endmacro %}
{% macro safety_form(troop, route, label, field='', value='') %}
<form hx-post="/einsatz/{{ incident.id }}/atemschutz/{{ troop.id }}/{{ route }}" hx-swap="none"
      @htmx:after-request="if ($event.detail.successful) { $el.reset(); } else { ECPBreathingNet.formFailed($event); }"
      @breathing-queued="$el.reset();">
  <input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}">
  {% if field %}<input type="hidden" name="{{ field }}" value="{{ value }}">{% endif %}
  <button type="submit" class="btn btn--ghost btn--sm">{{ label }}</button>
</form>
{% endmacro %}

{% set bsp_tag = 'details' if bsp_einklappbar else 'div' %}
<style>
#lft-bsp { max-width:100%; min-width:0; padding:12px 14px; border-top:1px solid var(--border); background:var(--surface-high, var(--surface)); }
#lft-bsp[hidden] { display:none; }
#lft-bsp > summary { cursor:pointer; min-height:44px; display:flex; flex-direction:column; justify-content:center; font-weight:700; }
#lft-bsp-bedienung { display:grid; gap:10px; }
#lft-bsp label { font-size:.85rem; font-weight:600; color:var(--text-muted); }
#lft-bsp label[for] { display:flex; justify-content:space-between; gap:8px; }
#lft-bsp label:has(> input[type=checkbox]) { display:flex; align-items:center; gap:10px; min-height:44px; font-size:1rem; font-weight:700; color:inherit; cursor:pointer; }
#lft-bsp input[type=checkbox] { width:22px; height:22px; accent-color:var(--red-light); }
#lft-bsp select { width:100%; max-width:100%; min-height:44px; padding:0 12px; border:1px solid var(--border); border-radius:var(--radius-sm, 6px); background:var(--surface); color:inherit; font:inherit; }
#lft-bsp input[type=range] { width:100%; min-height:44px; accent-color:var(--red-light); }
#lft-bsp-prozent { color:inherit; font-variant-numeric:tabular-nums; }
#lft-bsp-aktionen { display:flex; flex-wrap:wrap; gap:8px; }
#lft-bsp-aktionen .btn { flex:1 1 140px; min-height:44px; justify-content:center; white-space:normal; }
#lft-bsp small { display:block; overflow-wrap:anywhere; color:var(--text-muted); }
#lft-bsp-hinweis:empty, #lft-bsp-pruefen:empty { display:none; }
</style>
<{{ bsp_tag }} id="lft-bsp" hidden>
  {% if bsp_einklappbar %}<summary>Brandschutzplan
    <small id="lft-bsp-pruefen" role="status"></small>
  </summary>{% else %}<small id="lft-bsp-pruefen" role="status"></small>{% endif %}
  <div id="lft-bsp-bedienung">
  <label><input type="checkbox" id="lft-layer-bsp"> Brandschutzplan einblenden</label>
  <label for="lft-bsp-auswahl">Plan / Stand</label>
  <select id="lft-bsp-auswahl"></select>
  <label for="lft-bsp-deckkraft">Deckkraft <span id="lft-bsp-prozent"></span></label>
  <input type="range" id="lft-bsp-deckkraft" min="0.1" max="1" step="0.05">
  <div id="lft-bsp-aktionen">
  <button type="button" id="lft-bsp-reset" class="btn btn--secondary btn-sm">Vorgabe verwenden</button>
  <button type="button" id="lft-bsp-aus" class="btn btn--secondary btn-sm">Alle Pläne lokal ausblenden</button>
  </div>
  <small id="lft-bsp-lokal"></small>
  <small id="lft-bsp-hinweis" role="status"></small>
  </div>
</{{ bsp_tag }}>

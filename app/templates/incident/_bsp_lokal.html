<div id="lft-bsp" hidden style="max-width:100%;min-width:0;padding:8px;">
  <label><input type="checkbox" id="lft-layer-bsp"> Brandschutzplan</label>
  <label for="lft-bsp-auswahl">Plan / Stand</label>
  <select id="lft-bsp-auswahl" style="width:100%;max-width:100%;min-height:44px;"></select>
  <label for="lft-bsp-deckkraft">Deckkraft <span id="lft-bsp-prozent"></span></label>
  <input type="range" id="lft-bsp-deckkraft" min="0.1" max="1" step="0.05" style="width:100%;min-height:44px;">
  <button type="button" id="lft-bsp-reset" class="btn btn-sm">Vorgabe verwenden</button>
  <button type="button" id="lft-bsp-aus" class="btn btn-sm">Alle Pläne lokal ausblenden</button>
  <small id="lft-bsp-lokal" style="display:block;"></small>
  <small id="lft-bsp-hinweis" role="status" style="display:block;"></small>
</div>

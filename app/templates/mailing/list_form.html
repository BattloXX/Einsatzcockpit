{% extends "base.html" %}{% block title %}Neue Empfängerliste{% endblock %}{% block content %}<div class="container"><h1>Neue Empfängerliste</h1><form method="post" action="/mailing/lists/create"><input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}"><label>Name<input name="name" required></label><label>Beschreibung<input name="description"></label><label><input type="radio" name="kind" value="static" checked> Statisch</label><label><input type="radio" name="kind" value="dynamic"> Dynamisch</label><fieldset><legend>Dynamische Filter (UND)</legend><label>Aktiv-Status<select name="active"><option value="">Alle</option><option value="true">Aktiv</option><option value="false">Inaktiv</option></select></label><label>Mitglied seit, von<input type="date" name="member_since_after"></label><label>bis<input type="date" name="member_since_before"></label>{% for q in qualifications %}<label><input type="checkbox" name="qualification_codes" value="{{ q.code }}"> {{ q.label }}</label>{% endfor %}<label>Tags<select multiple name="tag_ids">{% for tag in tags %}<option value="{{ tag.id }}">{{ tag.name }}</option>{% endfor %}</select></label></fieldset><button>Anlegen</button></form></div>{% endblock %}

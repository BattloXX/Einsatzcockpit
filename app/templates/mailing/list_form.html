{% extends "base.html" %}{% block title %}Neue Empfängerliste{% endblock %}{% block content %}<div class="container"><h1>Neue Empfängerliste</h1><form method="post" action="/mailing/lists/create" style="display:grid;gap:16px"><input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}"><div class="form-group"><label for="list_name">Name</label><input class="form-input" id="list_name" name="name" required></div><div class="form-group"><label for="list_description">Beschreibung</label><input class="form-input" id="list_description" name="description"></div><div class="form-group form-group--checkbox"><label><input type="radio" name="kind" value="static" checked> Statisch</label></div><div class="form-group form-group--checkbox"><label><input type="radio" name="kind" value="dynamic"> Dynamisch</label></div><fieldset style="display:grid;gap:16px"><legend>Dynamische Filter (UND)</legend><div class="form-group"><label for="list_active">Aktiv-Status</label><select class="form-input" id="list_active" name="active"><option value="">Alle</option><option value="true">Aktiv</option><option value="false">Inaktiv</option></select></div><div class="form-group"><label for="member_since_after">Mitglied seit, von</label><input class="form-input" id="member_since_after" type="date" name="member_since_after"></div><div class="form-group"><label for="member_since_before">Bis</label><input class="form-input" id="member_since_before" type="date" name="member_since_before"></div>{% for q in qualifications %}<div class="form-group form-group--checkbox"><label><input type="checkbox" name="qualification_codes" value="{{ q.code }}"> {{ q.label }}</label></div>{% endfor %}<div class="form-group"><label for="list_tags">Tags</label><select class="form-input" id="list_tags" multiple name="tag_ids">{% for tag in tags %}<option value="{{ tag.id }}">{{ tag.name }}</option>{% endfor %}</select></div></fieldset><button class="btn btn--primary">Anlegen</button></form></div>{% endblock %}

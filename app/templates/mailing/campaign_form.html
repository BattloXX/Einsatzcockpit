{% extends "base.html" %}{% block title %}Neue Kampagne{% endblock %}{% block content %}<div class="container"><h1>Neue Kampagne</h1><form method="post" action="/mailing/campaigns/create" style="display:grid;gap:16px"><input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}"><div class="form-group"><label for="campaign_template">Vorlage</label><select class="form-input" id="campaign_template" name="template_id" required>{% for x in templates_list %}<option value="{{ x.id }}">{{ x.name }}</option>{% endfor %}</select></div><fieldset><legend>Empfängerlisten</legend>{% for x in recipient_lists %}<div class="form-group form-group--checkbox"><label><input type="checkbox" name="recipient_list_ids" value="{{ x.id }}"> {{ x.name }}</label></div>{% endfor %}</fieldset><div class="form-group"><label for="campaign_incident">Einsatz</label><select class="form-input" id="campaign_incident" name="source_incident_id"><option value="">–</option>{% for x in incidents %}<option value="{{ x.id }}">{{ x.title or x.id }}</option>{% endfor %}</select></div><div class="form-group"><label for="subject_override">Betreff überschreiben</label><input class="form-input" id="subject_override" name="subject_override"></div><div class="form-group"><label for="reply_to_override">Reply-To überschreiben</label><input class="form-input" id="reply_to_override" type="email" name="reply_to_override"></div><div class="form-group form-group--checkbox"><label><input type="checkbox" name="track_opens" value="1" checked> Öffnungen erfassen</label></div><div class="form-group form-group--checkbox"><label><input type="checkbox" name="track_clicks" value="1" checked> Klicks erfassen</label></div><div class="form-group"><label for="max_attempts_override">Maximale Versuche</label><input class="form-input" id="max_attempts_override" type="number" min="1" max="20" name="max_attempts_override" placeholder="3"></div><button class="btn btn--primary">Entwurf anlegen</button></form></div>{% endblock %}

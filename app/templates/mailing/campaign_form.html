{% extends "base.html" %}{% block title %}Neue Kampagne{% endblock %}{% block content %}<div class="container"><h1>Neue Kampagne</h1><form method="post" action="/mailing/campaigns/create"><input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}"><label>Vorlage<select name="template_id" required>{% for x in templates_list %}<option value="{{ x.id }}">{{ x.name }}</option>{% endfor %}</select></label><fieldset><legend>Empfängerlisten</legend>{% for x in recipient_lists %}<label><input type="checkbox" name="recipient_list_ids" value="{{ x.id }}"> {{ x.name }}</label>{% endfor %}</fieldset><label>Einsatz<select name="source_incident_id"><option value="">–</option>{% for x in incidents %}<option value="{{ x.id }}">{{ x.title or x.id }}</option>{% endfor %}</select></label><label>Betreff überschreiben<input name="subject_override"></label><label>Reply-To überschreiben<input type="email" name="reply_to_override"></label><label><input type="checkbox" name="track_opens" value="1" checked> Öffnungen erfassen</label><label><input type="checkbox" name="track_clicks" value="1" checked> Klicks erfassen</label><label>Maximale Versuche<input type="number" min="1" max="20" name="max_attempts_override" placeholder="3"></label><button class="btn btn-primary">Entwurf anlegen</button></form></div>{% endblock %}

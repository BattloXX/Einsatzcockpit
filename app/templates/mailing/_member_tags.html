<form method="post" action="/mailing/members/{{ member.id }}/tags" hx-post="/mailing/members/{{ member.id }}/tags" hx-target="this" hx-swap="outerHTML" style="display:inline-flex;gap:3px"><input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}"><select name="tag_ids" multiple aria-label="Mailing-Tags">{% for tag in tags %}<option value="{{ tag.id }}" {% if tag.id in assigned_ids %}selected{% endif %}>{{ tag.name }}</option>{% endfor %}</select><button class="btn btn--ghost btn--xs">Tags speichern</button></form>

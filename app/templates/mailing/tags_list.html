{% extends "base.html" %}{% block title %}Mailing-Tags{% endblock %}{% block content %}<div class="container"><h1>Mitglieder-Tags</h1><form method="post" action="/mailing/tags"><input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}"><input name="name" required><input type="color" name="color"><button>Anlegen</button></form>{% for x in items %}<p><span style="color:{{ x.color or 'inherit' }}">{{ x.name }}</span> <form style="display:inline" method="post" action="/mailing/tags/{{ x.id }}/delete"><input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}"><button>Löschen</button></form></p>{% endfor %}</div>{% endblock %}

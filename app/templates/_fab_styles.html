<style>
/* Gemeinsames Karten-Layout fuer Fahrtenbuch (fahrtenbuch/neu.html) und
   GSL-Einheitenmodus (einheit/einheit.html): Tablet-Hochformat als Primaerziel
   (einspaltig gestapelt), ab 980px zusaetzlich Bento-Grid (2 Spalten). */
.fab-page{max-width:720px;margin:0 auto;padding:1.25rem 1rem 6rem;}

.fab-header{margin-bottom:var(--space-lg);}
.fab-header__top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;}
.fab-header__brand{display:flex;align-items:center;gap:.875rem;min-width:0;}
.fab-header__logo{max-height:52px;max-width:84px;object-fit:contain;flex-shrink:0;}
.fab-header__emoji{display:flex;align-items:center;justify-content:center;color:var(--fab-accent,var(--red-light));flex-shrink:0;}
.fab-header__eyebrow{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--red-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fab-header__title{font-size:1.5rem;font-weight:700;margin:2px 0 0;line-height:1.2;}
.fab-header__sub{font-size:.85rem;color:var(--text-muted);margin:.625rem 0 0;}

.fab-grid{display:flex;flex-direction:column;gap:var(--gutter);}
.fab-grid__main, .fab-grid__side{display:contents;}

.fab-card{--fab-accent:var(--red);background:var(--surface-mid);border:1px solid var(--border);border-left:4px solid var(--fab-accent);border-radius:var(--radius-lg);padding:1.1rem 1rem;box-shadow:var(--shadow-card);}
.fab-card--ziel{--fab-accent:var(--org-task);}
.fab-card--zeit{--fab-accent:var(--outline);}
.fab-card--schaden{--fab-accent:var(--danger);background:rgba(216,48,48,.06);transition:background .15s;}
.fab-card--schaden.is-active{background:rgba(216,48,48,.14);}
.fab-card__head{display:flex;align-items:center;gap:.55rem;margin-bottom:1rem;}
.fab-card__icon{display:flex;align-items:center;color:var(--fab-accent);flex-shrink:0;}
.fab-card__title{font-size:1rem;font-weight:700;margin:0;}
.fab-card__body{display:flex;flex-direction:column;gap:1.1rem;}
.fab-card__body > #fahrzeug-felder,
.fab-card__body > #zweck-felder{display:contents;}

.fab-card .form-control{padding:.8rem .85rem;font-size:1rem;min-height:48px;}
.fab-card textarea.form-control{min-height:unset;}
.fab-card select.form-control{cursor:pointer;}

.fab-stat__top{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;flex-wrap:wrap;}
.fab-stat__badge{background:var(--surface-highest);color:var(--on-surface);font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:999px;white-space:nowrap;}
.fab-stat__input{background:var(--surface);border:2px solid var(--red);color:var(--red-light);font-size:1.9rem;font-weight:700;text-align:center;padding:.85rem;border-radius:var(--radius-lg);width:100%;margin-top:.5rem;min-height:unset;}
.fab-stat__input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(228,64,63,.25);}

.fab-subcard{border:1px solid var(--border);border-radius:var(--radius-md);padding:1rem;margin-top:.25rem;background:rgba(255,255,255,.02);}
.fab-subcard__title{font-weight:700;font-size:.9rem;margin:0 0 .85rem;}

.fb-input-warn{border-color:#f59e0b !important;background:rgba(245,158,11,.08) !important;}
.fb-name-warn{font-size:.8rem;color:#f59e0b;margin:.35rem 0 0;font-weight:600;}

.fab-actions{position:sticky;bottom:0;left:0;right:0;padding:1rem 0 max(.5rem, env(safe-area-inset-bottom));margin:.25rem -1rem 0;background:linear-gradient(to top, var(--bg) 60%, transparent);}
.fab-actions .btn{width:100%;}

@media (min-width:980px){
  .fab-page{max-width:1080px;padding-bottom:2.5rem;}
  .fab-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gutter);align-items:start;}
  .fab-grid__main{display:flex;flex-direction:column;gap:var(--gutter);grid-column:1 / span 8;}
  .fab-grid__side{display:flex;flex-direction:column;gap:var(--gutter);grid-column:9 / span 4;position:sticky;top:16px;}
  .fab-actions{position:static;background:none;padding:0;margin:0;}
}
</style>

{% if can_edit and termin.probeart and termin.probeart.uebungseinsatz_erlaubt %}
  {% if termin.exercise_incident_id %}
  <form method="post" action="/probenplanung/{{ termin.id }}/uebungseinsatz/starten">
    <input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}">
    <button class="btn btn--primary" type="submit">Übungseinsatz starten</button>
  </form>
  {% elif not exercise_form|default(false) %}
  <button class="btn btn--primary" type="button" hx-get="/probenplanung/{{ termin.id }}/uebungseinsatz" hx-target="#probe-exercise-content" onclick="document.getElementById('probe-exercise-dialog').showModal()">Übungseinsatz vorbereiten</button>
  {% else %}
  <button class="btn btn--primary" type="submit">Übungseinsatz anlegen</button>
  {% endif %}
{% endif %}

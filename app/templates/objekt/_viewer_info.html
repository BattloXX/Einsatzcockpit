<div id="objekt-viewer-info">
  {% for s in seiten %}
  <div x-show="idx === {{ loop.index0 }}">
    <div class="objekt-viewer__caption text-muted">{{ s.titel or ('Seite ' ~ s.seiten_nr) }}</div>
    {% if ist_verwalter %}
    <button type="button" class="btn btn--ghost btn--xs" style="margin-top:8px;" onclick="document.getElementById('viewerSeiteBearbeiten{{ s.id }}').showModal()">Bearbeiten</button>
    <dialog class="modal" id="viewerSeiteBearbeiten{{ s.id }}">
      <div class="modal__content">
        <div class="modal__header"><h3>Dokumentseite bearbeiten</h3>
          <button type="button" class="modal__close" aria-label="Schließen" onclick="this.closest('dialog').close()">×</button></div>
        <form hx-post="/objekte/{{ objekt.id }}/dokumente/seite/{{ s.id }}/bearbeiten"
              hx-target="#objekt-viewer-info" hx-swap="outerHTML">
          <div class="modal__body">
            <input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}">
            <input type="hidden" name="art" value="{{ filter_art }}"><input type="hidden" name="suche" value="{{ filter_suche }}"><input type="hidden" name="viewer" value="1">
            <div class="form-group"><label class="form-label">Dokumentart</label><select name="dokumentart" class="form-input"><option value="">- keine -</option>{% for code, label in dokumentarten.items() %}<option value="{{ code }}" {% if s.dokumentart == code %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
            <div class="form-group"><label class="form-label">Titel</label><input name="titel" class="form-input" maxlength="200" value="{{ s.titel or '' }}"></div>
            <div class="form-group"><label class="form-label">Melderlinie(n)</label><input name="melderlinien" class="form-input" maxlength="100" value="{{ s.melderlinien or '' }}"></div>
            <div class="form-group"><label class="form-label">Stand</label><input type="date" name="stand" class="form-input" value="{{ s.stand.isoformat() if s.stand else '' }}"></div>
            <label class="checkbox-label"><input type="checkbox" name="bei_einsatz_drucken" value="1" {% if s.bei_einsatz_drucken %}checked{% endif %}> Bei Einsatz drucken</label>
          </div>
          <div class="modal__footer"><button type="button" class="btn btn--ghost" onclick="this.closest('dialog').close()">Abbrechen</button><button type="submit" class="btn btn--primary">Speichern</button></div>
        </form>
      </div>
    </dialog>
    {% endif %}
  </div>
  {% endfor %}
</div>
